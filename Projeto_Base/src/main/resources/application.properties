# Perfil Ativo
spring.profiles.active=dev

# Servidor
server.port=8080
server.servlet.session.timeout=10m

# Thymeleaf
spring.thymeleaf.encoding=UTF-8

# Flyway
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true: seguro para bases existentes que ainda nao tem a tabela
# flyway_schema_history. Baseline em versao 0 garante que V1 tambem sera aplicado.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Configuracoes especificas de ambiente estao em application-{profile}.properties
# Perfis disponiveis: dev | prod | test
# Para alterar: export SPRING_PROFILES_ACTIVE=prod  ou  -Dspring.profiles.active=prod
