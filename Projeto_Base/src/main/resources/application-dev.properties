# ═══════════════════════════════════════════════════════════════════════════════
# Perfil DEV — ambiente local e Docker de desenvolvimento
#
# Para rodar localmente: mvn spring-boot:run  (usa localhost:3306)
# No Docker, o docker-compose.yml sobrescreve SPRING_DATASOURCE_URL para db:3306
# ═══════════════════════════════════════════════════════════════════════════════

# ── Datasource ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# update: Hibernate ajusta colunas novas sem apagar dados — confortável no dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.br.com.luismatos=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=INFO

# ── JWT ────────────────────────────────────────────────────────────────────────
# Chave gerada com: openssl rand -base64 32   (256 bits — APENAS PARA DEV)
app.jwt.secret=zOlp4UO4jR75dkrqu++lvzr2S0pnLYiuQEQo+tt6ioE=
# 24 horas em milissegundos
app.jwt.expiration-ms=86400000

# ── CORS ───────────────────────────────────────────────────────────────────────
# Origens permitidas para a API REST (Angular :4200, React :3000)
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
