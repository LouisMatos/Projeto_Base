# ═══════════════════════════════════════════════════════════════════════════════
# Perfil PROD — ambiente de produção
#
# Todas as credenciais via variáveis de ambiente — NUNCA hardcoded aqui.
# Ativação: SPRING_PROFILES_ACTIVE=prod
# ═══════════════════════════════════════════════════════════════════════════════

# ── Datasource ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP padrão do Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# validate: Hibernate confere o schema mas não altera — Flyway é o responsável
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=true

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.br.com.luismatos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ── JWT ────────────────────────────────────────────────────────────────────────
# Defina JWT_SECRET como variável de ambiente em produção (mínimo 256 bits em Base64)
app.jwt.secret=${JWT_SECRET}
# Expiração padrão: 24h (pode ser sobrescrita via JWT_EXPIRATION_MS)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://seu-frontend.com}
