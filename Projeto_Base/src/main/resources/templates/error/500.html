<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro interno — Projeto Base</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container text-center" style="padding-top: 80px;">
    <h1 style="font-size: 80px; color: #d9534f;">500</h1>
    <h3>Erro interno do servidor</h3>
    <p class="text-muted" th:text="${mensagem}">
        Ocorreu um erro inesperado. Tente novamente ou contate o suporte.
    </p>
    <a th:href="@{/aplicacao/principal}" class="btn btn-primary" style="margin-top: 20px;">
        <span class="glyphicon glyphicon-home" style="margin-right: 6px;"></span>
        Voltar ao início
    </a>
</div>
</body>
</html>
