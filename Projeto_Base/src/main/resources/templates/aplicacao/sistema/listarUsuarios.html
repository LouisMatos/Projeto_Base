<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}"
      lang="pt-BR">
<head>
    <title>Usuários</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid" style="padding: 30px 20px 50px;">

        <!-- Breadcrumb -->
        <ol class="breadcrumb">
            <li><a th:href="@{/aplicacao/principal}">
                <span class="glyphicon glyphicon-home"></span> Principal
            </a></li>
            <li>Sistema</li>
            <li class="active">Usuários</li>
        </ol>

        <!-- Cabeçalho -->
        <div class="row" style="margin-bottom: 20px;">
            <div class="col-xs-12 col-sm-8">
                <h3 style="margin: 0;">
                    <span class="glyphicon glyphicon-list-alt"
                          style="margin-right: 8px; color: #337ab7;"></span>
                    Usuários Cadastrados
                </h3>
            </div>
            <div class="col-xs-12 col-sm-4 text-right" style="padding-top: 6px;">
                <a th:href="@{/aplicacao/sistema/usuario/novo}" class="btn btn-primary">
                    Novo Usuário
                </a>
            </div>
        </div>

        <!-- Tabela -->
        <div class="panel panel-default" style="box-shadow: 0 2px 8px rgba(0,0,0,0.10);">
            <div class="panel-body" style="padding: 0;">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" style="margin-bottom: 0;">
                        <thead>
                            <tr style="background-color: #337ab7; color: #fff;">
                                <th style="width:50px; text-align:center;">#</th>
                                <th>
                                    <span class="glyphicon glyphicon-envelope" style="margin-right:5px;"></span>
                                    E-mail
                                </th>
                                <th style="width:160px;">
                                    <span class="glyphicon glyphicon-tag" style="margin-right:5px;"></span>
                                    Tipo
                                </th>
                                <th style="width:130px; text-align:center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>

                            <!-- Estado vazio -->
                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="4" class="text-center text-muted" style="padding:40px;">
                                    <span class="glyphicon glyphicon-inbox"
                                          style="font-size:36px; display:block; margin-bottom:12px; opacity:0.4;"></span>
                                    Nenhum usuário cadastrado.
                                </td>
                            </tr>

                            <!-- Linhas -->
                            <tr th:each="usuario, stat : ${usuarios}">
                                <td class="text-center text-muted" style="vertical-align:middle;"
                                    th:text="${stat.index + 1}"></td>

                                <td style="vertical-align:middle;">
                                    <span class="glyphicon glyphicon-user"
                                          style="margin-right:5px; color:#aaa;"></span>
                                    <span th:text="${usuario.email}"></span>
                                </td>

                                <td style="vertical-align:middle;">
                                    <span th:class="${usuario.tipoUsuario.name() == 'ADMINISTRADOR'
                                                     ? 'label label-primary' : 'label label-default'}"
                                          style="font-size:12px; padding:4px 8px;"
                                          th:text="${usuario.tipoUsuario.descricao}"></span>
                                </td>

                                <td style="text-align:center; vertical-align:middle; white-space:nowrap;">
                                    <div sec:authorize="hasRole('ADMINISTRADOR')"
                                         style="display:inline-flex; gap:6px;">
                                        <!-- Editar: abre modal via JS com dados do usuário -->
                                        <button type="button"
                                                class="btn btn-info btn-xs btn-editar"
                                                th:data-id="${usuario.id}"
                                                th:data-email="${usuario.email}"
                                                th:data-tipo="${usuario.tipoUsuario}">
                                            <span class="glyphicon glyphicon-pencil"></span> Editar
                                        </button>
                                        <!-- Excluir: form POST direto com confirmação JS -->
                                        <button type="button"
                                                class="btn btn-danger btn-xs btn-excluir"
                                                th:data-id="${usuario.id}"
                                                th:data-email="${usuario.email}">
                                            <span class="glyphicon glyphicon-trash"></span> Excluir
                                        </button>
                                    </div>
                                    <span sec:authorize="!hasRole('ADMINISTRADOR')"
                                          class="text-muted" style="font-size:12px;">
                                        <span class="glyphicon glyphicon-lock"></span> Restrito
                                    </span>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <p class="text-muted" style="font-size:12px; margin-top:8px;">
            Total: <strong th:text="${#lists.size(usuarios)}"></strong>
            <span th:text="${#lists.size(usuarios) == 1 ? 'usuário' : 'usuários'}"></span>
        </p>

    </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     MODAL DE EDIÇÃO — fora do layout:fragment para evitar forms aninhados
     ══════════════════════════════════════════════════════════════════ -->
<th:block layout:fragment="extraScripts">

    <div id="editarUsuarioModal" class="modal fade" tabindex="-1"
         role="dialog" aria-labelledby="editarUsuarioTitulo">
        <div class="modal-dialog" role="document" style="max-width:460px; margin:60px auto;">
            <div class="modal-content"
                 style="border-radius:6px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.25);">

                <div class="modal-header" style="background-color:#337ab7; color:#fff;">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Fechar"
                            style="color:#fff; opacity:0.85; text-shadow:none;">
                        <span aria-hidden="true">&#215;</span>
                    </button>
                    <h4 class="modal-title" id="editarUsuarioTitulo"
                        style="color:#fff; font-weight:600;">
                        <span class="glyphicon glyphicon-pencil" style="margin-right:8px;"></span>
                        Editar Usuário
                    </h4>
                </div>

                <form th:action="@{/aplicacao/sistema/usuario/editar}" method="post"
                      id="formEdicao" autocomplete="off">

                    <input type="hidden" id="editId" name="id">

                    <div class="modal-body" style="padding:24px 28px 16px;">

                        <!-- E-mail -->
                        <div class="form-group">
                            <label class="control-label" style="font-weight:600; color:#555;">
                                <span class="glyphicon glyphicon-envelope" style="margin-right:4px;"></span>
                                E-mail <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" id="editEmail"
                                   name="email" placeholder="nome@dominio.com">
                        </div>

                        <!-- Tipo de Usuário -->
                        <div class="form-group">
                            <label class="control-label" style="font-weight:600; color:#555;">
                                <span class="glyphicon glyphicon-tag" style="margin-right:4px;"></span>
                                Tipo de Usuário <span class="text-danger">*</span>
                            </label>
                            <select class="form-control" id="editTipo" name="tipoUsuario">
                                <option th:each="tipo : ${tiposUsuario}"
                                        th:value="${tipo}"
                                        th:text="${tipo.descricao}"></option>
                            </select>
                        </div>

                        <hr style="margin:16px 0 14px;">

                        <p class="text-muted" style="font-size:12px; margin-bottom:12px;">
                            <span class="glyphicon glyphicon-info-sign"></span>
                            Deixe os campos de senha em branco para <strong>manter a senha atual</strong>.
                        </p>

                        <!-- Nova Senha -->
                        <div class="form-group">
                            <label class="control-label" style="font-weight:600; color:#555;">
                                <span class="glyphicon glyphicon-lock" style="margin-right:4px;"></span>
                                Nova Senha
                            </label>
                            <input type="password" class="form-control" name="senha"
                                   placeholder="Nova senha (opcional)" autocomplete="new-password">
                        </div>

                        <!-- Confirmar Nova Senha -->
                        <div class="form-group">
                            <label class="control-label" style="font-weight:600; color:#555;">
                                <span class="glyphicon glyphicon-lock" style="margin-right:4px;"></span>
                                Confirmar Nova Senha
                            </label>
                            <input type="password" class="form-control" name="confirmaSenha"
                                   placeholder="Repita a nova senha" autocomplete="new-password">
                        </div>

                    </div>

                    <div class="modal-footer" style="border-top:1px solid #eee; padding:14px 20px;">
                        <button type="button" class="btn btn-default"
                                data-dismiss="modal" style="min-width:100px; margin-right:8px;">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary" style="min-width:140px;">
                            Salvar Alterações
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Form oculto para exclusão (evita GET com id na URL) -->
    <form id="formExclusao" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="id" id="excluirId">
    </form>

    <script th:inline="javascript">
        (function () {
            var ctxPath = /*[[@{/}]]*/ '/';

            // ── Editar ────────────────────────────────────────────────────────
            document.querySelectorAll('.btn-editar').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.getElementById('editId').value    = btn.dataset.id;
                    document.getElementById('editEmail').value = btn.dataset.email;
                    var select = document.getElementById('editTipo');
                    for (var i = 0; i < select.options.length; i++) {
                        select.options[i].selected = (select.options[i].value === btn.dataset.tipo);
                    }
                    $('#editarUsuarioModal').modal('show');
                });
            });

            // ── Excluir ───────────────────────────────────────────────────────
            document.querySelectorAll('.btn-excluir').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var email = btn.dataset.email;
                    var id    = btn.dataset.id;
                    AppConfirm.show({
                        titulo:    'Excluir Usuário',
                        mensagem:  'Deseja realmente excluir o usuário ' + email + '?',
                        onConfirm: function () {
                            var form   = document.getElementById('formExclusao');
                            form.action = ctxPath + 'aplicacao/sistema/usuario/excluir/' + id;
                            form.submit();
                        }
                    });
                });
            });
        })();
    </script>

</th:block>

</body>
</html>
