<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE — Projeto Base">Projeto Base</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-theme.css}">
    <link rel="stylesheet" th:href="@{/css/topmenu.css}">
    <link rel="stylesheet" th:href="@{/css/DeixarRodapeNoFim.css}">
    <link rel="stylesheet" th:href="@{/css/appModal.css}">

    <!-- Slot para CSS específico da página -->
    <th:block layout:fragment="extraStyles"></th:block>
</head>
<body>

<!-- Topmenu -->
<div id="header" class="header">
    <th:block th:replace="~{layout/topmenu :: topmenu}"></th:block>
</div>


<!-- Conteúdo principal -->
<div class="bs-example">
    <div id="content" class="content">
        <div layout:fragment="content">
            <!-- O conteúdo de cada página é inserido aqui -->
        </div>
    </div>
</div>

<!-- Modais globais (AppModal + AppConfirm) -->
<th:block th:replace="~{layout/modalMensagem :: modais}"></th:block>

<!-- Rodapé -->
<div id="footer" class="footer">
    <th:block th:replace="~{layout/footer :: footer}"></th:block>
</div>

<!-- JS base -->
<script th:src="@{/js/jquery-1.11.1.js}"></script>
<script th:src="@{/js/bootstrap.js}"></script>
<script th:src="@{/js/appModal.js}"></script>
<script th:src="@{/js/topmenu.js}"></script>

<!-- Dispara AppModal automaticamente para qualquer página que receba sucesso/erro -->
<script th:if="${sucesso}" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        AppModal.showSucesso([[${sucesso}]]);
    });
</script>
<script th:if="${erro}" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        AppModal.showErro([[${erro}]]);
    });
</script>

<!-- Slot para scripts específicos da página -->
<th:block layout:fragment="extraScripts"></th:block>

</body>
</html>
