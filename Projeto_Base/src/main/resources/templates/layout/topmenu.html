<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<body>
<div th:fragment="topmenu">
    <div class="bs-example">
        <nav role="navigation" class="navbar navbar-default">

            <div class="navbar-header">
                <button type="button" data-target="#navbarCollapse"
                        data-toggle="collapse" class="navbar-toggle">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </div>

            <div id="navbarCollapse" class="collapse navbar-collapse">

                <!-- Menu principal (esquerda) -->
                <ul class="nav navbar-nav">
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                            Aluno <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a th:href="@{/aplicacao/aluno/cadastrar}">Cadastrar</a></li>
                            <li><a th:href="@{/aplicacao/aluno/listar}">Listar</a></li>
                        </ul>
                    </li>
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                            Curso <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a th:href="@{/aplicacao/curso/cadastrar}">Cadastrar</a></li>
                            <li><a th:href="@{/aplicacao/curso/listar}">Listar</a></li>
                        </ul>
                    </li>
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                            Professor <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a th:href="@{/aplicacao/professor/cadastrar}">Cadastrar</a></li>
                            <li><a th:href="@{/aplicacao/professor/listar}">Listar</a></li>
                        </ul>
                    </li>
                </ul>

                <!-- Menu Sistema + Logout (direita) -->
                <ul class="nav navbar-nav navbar-right">
                    <li class="dropdown" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown"
                           role="button" aria-haspopup="true" aria-expanded="false">
                            Sistema <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li class="dropdown-submenu">
                                <a class="dropdown-submenu-trigger" tabindex="-1" href="#">
                                    Usuário <span class="caret"></span>
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a th:href="@{/aplicacao/sistema/usuario/novo}">Novo</a></li>
                                    <li><a th:href="@{/aplicacao/sistema/usuario/listar}">Listar</a></li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button type="submit" title="Sair"
                                    style="display:block; background:none; border:none; cursor:pointer;
                                           color:inherit; padding:15px 15px; line-height:20px;
                                           font-size:14px; text-decoration:none;">
                                <span class="glyphicon glyphicon-log-out" aria-hidden="true"></span>
                            </button>
                        </form>
                    </li>
                </ul>

            </div>
        </nav>
    </div>

    <style>
        .dropdown-submenu { position: relative; }
        .dropdown-submenu .dropdown-menu { top: 0; right: 100%; margin-top: -1px; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.dropdown-submenu-trigger').forEach(function (el) {
                el.addEventListener('click', function (e) {
                    var next = el.nextElementSibling;
                    if (next) { next.style.display = next.style.display === 'block' ? 'none' : 'block'; }
                    e.stopPropagation();
                    e.preventDefault();
                });
            });
        });
    </script>
</div>
</body>
</html>
