<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html">

<ui:composition template="/layout/layout.xhtml">

    <ui:define name="pageTitle">404 — Página não encontrada</ui:define>

    <ui:define name="content">
        <div class="container-fluid text-center" style="padding: 60px 20px;">

            <h1 style="font-size: 120px; font-weight: bold; color: #cccccc;
                        margin: 0; line-height: 1.1; letter-spacing: -4px;">
                404
            </h1>

            <h2 style="margin-top: 10px; margin-bottom: 20px; color: #555555;">
                Página não encontrada
            </h2>

            <p class="text-muted" style="font-size: 15px; margin-bottom: 30px;">
                O endereço
                <strong>
                    #{requestScope['javax.servlet.error.request_uri']}
                </strong>
                não existe ou foi removido.
            </p>

            <h:link outcome="/index" styleClass="btn btn-primary btn-lg"
                    value="Voltar ao início"/>

        </div>
    </ui:define>

</ui:composition>
</html>
