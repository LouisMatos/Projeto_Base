<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/layout/layout.xhtml">

    <ui:define name="pageTitle">Novo Usuário — Projeto Base</ui:define>

    <ui:define name="content">
        <div class="container" style="padding-top: 30px; padding-bottom: 50px;">

            <!-- Breadcrumb ─────────────────────────────────────────────────── -->
            <ol class="breadcrumb">
                <li>
                    <h:link outcome="/aplicacao/principal.xhtml">
                        <span class="glyphicon glyphicon-home"/> Principal
                    </h:link>
                </li>
                <li>Sistema</li>
                <li class="active">Novo Usuário</li>
            </ol>

            <!-- Painel central (responsivo: ocupa 8 colunas em md, 6 em lg) ── -->
            <div class="row">
                <div class="col-xs-12 col-sm-10 col-sm-offset-1 col-md-8 col-md-offset-2 col-lg-6 col-lg-offset-3">

                    <div class="panel panel-primary">

                        <!-- Cabeçalho ──────────────────────────────────────── -->
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <span class="glyphicon glyphicon-user" style="margin-right: 8px;"/>
                                Cadastro de Usuário
                            </h3>
                        </div>

                        <!-- Corpo ──────────────────────────────────────────── -->
                        <div class="panel-body">

                            <h:form id="formNovoUsuario" autocomplete="off">

                                <!-- E-mail ─────────────────────────────────── -->
                                <div class="form-group">
                                    <label for="email" class="control-label">
                                        <span class="glyphicon glyphicon-envelope" style="margin-right: 4px;"/>
                                        E-mail <span class="text-danger">*</span>
                                    </label>
                                    <h:inputText id="email"
                                                 value="#{novoUsuarioController.usuario.email}"
                                                 converter="ConverterEmptyToNull"
                                                 styleClass="form-control"
                                                 required="true"
                                                 requiredMessage="O e-mail é obrigatório.">
                                        <f:passThroughAttribute name="type"         value="email"/>
                                        <f:passThroughAttribute name="placeholder"  value="nome@dominio.com"/>
                                        <f:passThroughAttribute name="autocomplete" value="off"/>
                                    </h:inputText>
                                    <h:message for="email" styleClass="help-block text-danger"/>
                                </div>

                                <!-- Senha ──────────────────────────────────── -->
                                <div class="form-group">
                                    <label for="senha" class="control-label">
                                        <span class="glyphicon glyphicon-lock" style="margin-right: 4px;"/>
                                        Senha <span class="text-danger">*</span>
                                    </label>
                                    <h:inputSecret id="senha"
                                                   value="#{novoUsuarioController.usuario.senha}"
                                                   styleClass="form-control"
                                                   required="true"
                                                   requiredMessage="A senha é obrigatória."
                                                   redisplay="false">
                                        <f:passThroughAttribute name="placeholder"  value="Mínimo 6 caracteres"/>
                                        <f:passThroughAttribute name="autocomplete" value="new-password"/>
                                    </h:inputSecret>
                                    <h:message for="senha" styleClass="help-block text-danger"/>
                                </div>

                                <!-- Confirmar Senha ─────────────────────────── -->
                                <div class="form-group">
                                    <label for="confirmaSenha" class="control-label">
                                        <span class="glyphicon glyphicon-lock" style="margin-right: 4px;"/>
                                        Confirmar Senha <span class="text-danger">*</span>
                                    </label>
                                    <h:inputSecret id="confirmaSenha"
                                                   value="#{novoUsuarioController.usuario.confirmaSenha}"
                                                   styleClass="form-control"
                                                   required="true"
                                                   requiredMessage="A confirmação de senha é obrigatória."
                                                   redisplay="false">
                                        <f:passThroughAttribute name="placeholder"  value="Repita a senha"/>
                                        <f:passThroughAttribute name="autocomplete" value="new-password"/>
                                    </h:inputSecret>
                                    <h:message for="confirmaSenha" styleClass="help-block text-danger"/>
                                </div>

                                <!-- Tipo de Usuário ─────────────────────────── -->
                                <div class="form-group">
                                    <label for="tipoUsuario" class="control-label">
                                        <span class="glyphicon glyphicon-tag" style="margin-right: 4px;"/>
                                        Tipo de Usuário <span class="text-danger">*</span>
                                    </label>
                                    <h:selectOneMenu id="tipoUsuario"
                                                     value="#{novoUsuarioController.usuario.tipoUsuario}"
                                                     styleClass="form-control"
                                                     required="true"
                                                     requiredMessage="Selecione o tipo de usuário.">
                                        <f:selectItem itemLabel="— Selecione —"
                                                      itemValue="#{null}"
                                                      noSelectionOption="true"/>
                                        <f:selectItems value="#{novoUsuarioController.tiposUsuario}"
                                                       var="tipo"
                                                       itemValue="#{tipo}"
                                                       itemLabel="#{tipo.descricao}"/>
                                    </h:selectOneMenu>
                                    <h:message for="tipoUsuario" styleClass="help-block text-danger"/>
                                </div>

                                <!-- Legenda ────────────────────────────────── -->
                                <p class="text-muted" style="font-size: 12px; margin-bottom: 20px;">
                                    <span class="text-danger">*</span> Campos obrigatórios
                                </p>

                                <hr style="margin-top: 0;"/>

                                <!-- Botões ──────────────────────────────────── -->
                                <div class="row">

                                    <!-- Limpar (ignora validações) -->
                                    <div class="col-xs-12 col-sm-5" style="margin-bottom: 10px;">
                                        <p:commandButton id="btnLimpar"
                                                         value="Limpar"
                                                         action="#{novoUsuarioController.limpar}"
                                                         styleClass="btn btn-default btn-block"
                                                         immediate="true"
                                                         process="@this"
                                                         update="@form :growl">
                                            <f:facet name="loading">
                                                <span class="glyphicon glyphicon-refresh"/>
                                            </f:facet>
                                        </p:commandButton>
                                    </div>

                                    <!-- Salvar (processa e valida o formulário inteiro) -->
                                    <div class="col-xs-12 col-sm-7">
                                        <p:commandButton id="btnSalvar"
                                                         value="Salvar Usuário"
                                                         action="#{novoUsuarioController.salvar}"
                                                         styleClass="btn btn-primary btn-block"
                                                         process="@form"
                                                         update="@form :growl">
                                            <f:facet name="loading">
                                                <span class="glyphicon glyphicon-refresh"/>
                                            </f:facet>
                                        </p:commandButton>
                                    </div>

                                </div>
                                <!-- /row botões -->

                            </h:form>

                        </div>
                        <!-- /panel-body -->

                    </div>
                    <!-- /panel -->

                </div>
            </div>
            <!-- /row -->

        </div>
        <!-- /container -->
    </ui:define>

    <!-- CSS específico desta página ─────────────────────────────────────────── -->
    <ui:define name="extraStyles">
        <style>
            /* Painel: sombra suave */
            .panel-primary {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            }

            /* Labels mais destacados */
            .control-label {
                font-weight: 600;
                color: #555;
            }

            /* Mensagens de erro inline */
            .help-block {
                display: block;
                margin-top: 4px;
                font-size: 12px;
            }

            /* Inputs com foco destacado */
            .form-control:focus {
                border-color: #337ab7;
                box-shadow: inset 0 1px 1px rgba(0,0,0,.075), 0 0 6px rgba(51,122,183,.4);
            }

            /* Ajuste responsivo dos botões em xs */
            @media (max-width: 767px) {
                .panel-body { padding: 20px 15px; }
            }
        </style>
    </ui:define>

</ui:composition>
</html>
