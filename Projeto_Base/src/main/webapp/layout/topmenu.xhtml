<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui">

    <h:form>
        <div class="bs-example">
            <nav role="navigation" class="navbar navbar-default">

                <div class="navbar-header">
                    <button type="button" data-target="#navbarCollapse"
                            data-toggle="collapse" class="navbar-toggle">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                </div>

                <div id="navbarCollapse" class="collapse navbar-collapse">

                    <!-- ═══════════════════════════════════════════════════════
                         MENU PRINCIPAL (esquerda)

                         Para adicionar um novo item de menu:
                           1. Adicione a constante em Rota.java (caminho + nível de acesso)
                           2. Adicione o método irParaXxx() em NavigationController.java
                           3. Copie um bloco <li class="dropdown"> abaixo e ajuste o texto
                         ═══════════════════════════════════════════════════ -->
                    <ul class="nav navbar-nav">

                        <li class="dropdown">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown">Aluno<span class="caret"/></a>
                            <ul class="dropdown-menu">
                                <li><h:commandLink action="#{navigationController.irParaCadastrarAluno}">Cadastrar</h:commandLink></li>
                                <li><h:commandLink action="#{navigationController.irParaListarAlunos}">Listar</h:commandLink></li>
                            </ul>
                        </li>
                        <li class="dropdown">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown">Curso<span class="caret"/></a>
                            <ul class="dropdown-menu">
                                <li><h:commandLink action="#{navigationController.irParaCadastrarCurso}">Cadastrar</h:commandLink></li>
                                <li><h:commandLink action="#{navigationController.irParaListarCursos}">Listar</h:commandLink></li>
                            </ul>
                        </li>
                        <li class="dropdown">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown">Professor<span class="caret"/></a>
                            <ul class="dropdown-menu">
                                <li><h:commandLink action="#{navigationController.irParaCadastrarProfessor}">Cadastrar</h:commandLink></li>
                                <li><h:commandLink action="#{navigationController.irParaListarProfessores}">Listar</h:commandLink></li>
                            </ul>
                        </li>

                    </ul>

                    <!-- ═══════════════════════════════════════════════════════
                         MENU SISTEMA + LOGOUT (direita)
                         ═══════════════════════════════════════════════════ -->

                    <!-- Logout -->
                    <ul class="nav navbar-nav navbar-right">
                        <li>
                            <h:commandLink action="#{navigationController.doLogout}" value="">
                                <span class="glyphicon glyphicon-log-out" aria-hidden="true"/>
                            </h:commandLink>
                        </li>
                    </ul>

                    <!-- Menu Sistema: visível apenas para ADMINISTRADOR -->
                    <h:panelGroup rendered="#{navigationController.podeAcessar('NOVO_USUARIO')}">
                        <ul class="nav navbar-nav navbar-right">
                            <li class="dropdown">
                                <a href="#" class="dropdown-toggle" data-toggle="dropdown"
                                   role="button" aria-haspopup="true" aria-expanded="false">
                                    Sistema<span class="caret"/>
                                </a>
                                <ul class="dropdown-menu">
                                    <li class="dropdown-submenu">
                                        <a class="dropdown-submenu-trigger" tabindex="-1" href="#">
                                            Usuário<span class="caret"/>
                                        </a>
                                        <ul class="dropdown-menu">
                                            <li>
                                                <h:commandLink action="#{navigationController.irParaNovoUsuario}">
                                                    Novo
                                                </h:commandLink>
                                            </li>
                                            <li>
                                                <h:commandLink action="#{navigationController.irParaListarUsuarios}">
                                                    Listar
                                                </h:commandLink>
                                            </li>
                                        </ul>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </h:panelGroup>

                </div>
            </nav>
        </div>
    </h:form>

    <style>
        .dropdown-submenu { position: relative; }
        .dropdown-submenu .dropdown-menu { top: 0; right: 100%; margin-top: -1px; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.dropdown-submenu-trigger').forEach(function (el) {
                el.addEventListener('click', function (e) {
                    var next = el.nextElementSibling;
                    if (next) { next.style.display = next.style.display === 'block' ? 'none' : 'block'; }
                    e.stopPropagation();
                    e.preventDefault();
                });
            });
        });
    </script>

</ui:composition>
