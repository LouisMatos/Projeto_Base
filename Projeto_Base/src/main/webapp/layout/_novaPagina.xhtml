<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
    ══════════════════════════════════════════════════════════════════
    SKELETON — COMO CRIAR UMA NOVA PÁGINA
    ══════════════════════════════════════════════════════════════════

    1. Copie este arquivo para a pasta correta dentro de /aplicacao/
    2. Renomeie para o nome da sua página (ex: listarAlunos.xhtml)
    3. Preencha os 2 slots obrigatórios: pageTitle e content
    4. Os slots extraStyles e extraScripts são OPCIONAIS

    SLOTS disponíveis no template:
    ┌─────────────────┬───────────────────────────────────────────────┐
    │ pageTitle       │ Título que aparece na aba do browser           │
    │ content         │ Conteúdo principal da página (obrigatório)     │
    │ extraStyles     │ CSS adicional só para esta página (opcional)   │
    │ extraScripts    │ JS adicional só para esta página (opcional)    │
    │ header          │ Substitui o topmenu inteiro (raramente usado)  │
    │ footer          │ Substitui o rodapé inteiro (raramente usado)   │
    └─────────────────┴───────────────────────────────────────────────┘
    ══════════════════════════════════════════════════════════════════
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/layout/layout.xhtml">

    <!-- Título na aba do browser -->
    <ui:define name="pageTitle">Título da Página</ui:define>

    <!-- ── CONTEÚDO PRINCIPAL (obrigatório) ───────────────────────────── -->
    <ui:define name="content">

        <h2>Título visível na página</h2>

        <!-- Coloque aqui os componentes PrimeFaces, tabelas, formulários etc. -->

    </ui:define>

    <!-- ── CSS ESPECÍFICO desta página (remova se não precisar) ──────── -->
    <!--
    <ui:define name="extraStyles">
        <link type="text/css" rel="stylesheet"
              href="#{request.contextPath}/resources/css/minha-pagina.css"/>
    </ui:define>
    -->

    <!-- ── JS ESPECÍFICO desta página (remova se não precisar) ──────── -->
    <!--
    <ui:define name="extraScripts">
        <script src="#{request.contextPath}/resources/js/minha-pagina.js"></script>
    </ui:define>
    -->

</ui:composition>
</html>
