# ═══════════════════════════════════════════════════════════════════════════════
# Perfil TEST — banco H2 em memória, sem Flyway, DDL gerenciado pelo Hibernate
# ═══════════════════════════════════════════════════════════════════════════════

# ── H2 em memória (modo MySQL para compatibilidade de sintaxe) ─────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Flyway desabilitado nos testes (H2 não é compatível com as migrations MySQL)
spring.flyway.enabled=false

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Logging silencioso nos testes ──────────────────────────────────────────────
logging.level.root=ERROR
logging.level.br.com.luismatos=WARN

# ── JWT (valor fixo para testes) ───────────────────────────────────────────────
app.jwt.secret=dGVzdGVTZWNyZXRLZXlGb3JUZXNkaW5nT25seTEyMzQ=
app.jwt.expiration-ms=3600000

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200
