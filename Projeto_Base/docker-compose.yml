services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: agenda
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-dev.sql:/docker-entrypoint-initdb.d/01-init-dev.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Aplicação Spring Boot (JAR embutido — sem Tomcat externo) ───────────────
  app:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ativa o perfil dev (mesmas configurações do application-dev.properties)
      SPRING_PROFILES_ACTIVE: dev
      # Sobrescreve a URL localhost do perfil dev para o serviço "db" do compose
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      # Limita heap da JVM para não saturar o M1 com 8 GB
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
